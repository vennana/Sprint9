name: Selenium tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies
        run: pip install -r requirements.txt


      - name: Pull Selenoid Chrome image
        run: docker pull selenoid/chrome:128.0

      - name: Start Selenoid
        run: |
          docker run -d --name selenoid \
            -p 4444:4444 \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${{ github.workspace }}/config:/etc/selenoid" \
            aerokube/selenoid:latest \
            -conf /etc/selenoid/browsers.json


      - name: Wait for Selenoid
        run: |
          sleep 10
          curl --fail --retry 30 --retry-delay 3 --retry-all-errors http://localhost:4444/status

      - name: Run tests
        env:
          SELENOID_URL: http://localhost:4444/wd/hub
        run: pytest -v --alluredir=allure-results tests/

      - name: Generate Allure report
        if: always()
        uses: simple-elf/allure-report-action@v1.15
        with:
          allure_results: allure-results
          allure_report: allure-report

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          if-no-files-found: warn